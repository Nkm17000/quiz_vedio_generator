name: Generate Quiz Video

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: quiz-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore Python environment
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-py311-venv-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Prepare memory
        run: |
          mkdir -p data/history output
          if [ ! -f data/history/history.json ]; then
            echo '{"counter": 0}' > data/history/history.json
          fi

      - name: Run Quiz Generator
        run: .venv/bin/python app.py
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          TTS_VOICE: en-IN-NeerjaNeural
          TTS_RATE: +0%
          TTS_VOLUME: +0%

      - name: Commit quiz memory
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/history/
          git commit -m "Update quiz counter" || echo "No changes"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Retry $i..."
            sleep 5
          done

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: quiz-video
          path: output/quiz_video.mp4
