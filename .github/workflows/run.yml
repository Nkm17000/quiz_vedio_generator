name: Generate Quiz Video

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes

permissions:
  contents: write

concurrency:
  group: quiz-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # =========================
      # 📥 Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # ⚡ Cache pip
      # =========================
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      # =========================
      # 🧱 System deps
      # =========================
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf ffmpeg

      # =========================
      # 🌐 Fonts
      # =========================
      - name: Install Hindi fonts
        run: |
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-noto-color-emoji

      # =========================
      # 🔧 wkhtmltoimage fix
      # =========================
      - name: Ensure wkhtmltoimage exists
        run: |
          if [ ! -f /usr/bin/wkhtmltoimage ]; then
            sudo ln -s /usr/bin/wkhtmltopdf /usr/bin/wkhtmltoimage
          fi

      # =========================
      # 🐍 Python
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # =========================
      # 📦 Install deps (LIGHT)
      # =========================
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # =========================
      # 🧠 Prepare memory
      # =========================
      - name: Prepare memory
        run: |
          mkdir -p data/history
          if [ ! -f data/history/history.json ]; then
            echo '{"counter": 0}' > data/history/history.json
          fi

      # =========================
      # 📁 Output dir
      # =========================
      - name: Create output folder
        run: mkdir -p output

      # =========================
      # ▶️ Run app
      # =========================
      - name: Run Quiz Generator
        run: python app.py
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}

      # =========================
      # 💾 Commit memory (SAFE)
      # =========================
      - name: Commit quiz memory
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add data/history/

          git commit -m "Update quiz counter" || echo "No changes"

          for i in 1 2 3
          do
            git pull --rebase origin main && git push origin main && break
            echo "Retry $i..."
            sleep 5
          done

      # =========================
      # 📤 Upload video artifact
      # =========================
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: quiz-video
          path: output/quiz_video.mp4